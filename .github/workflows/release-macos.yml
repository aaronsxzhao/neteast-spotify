name: Build and release macOS installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep the newest pending build, without interrupting an atomic draft publish.
concurrency:
  group: macos-installer-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'aaronsxzhao/neteast-spotify' && github.ref == 'refs/heads/main'
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          architecture: arm64
      - name: Install locked dependencies
        run: |
          npm install --global pnpm@9.15.9
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Run all regression tests
        run: node --test test/*.test.js
      - name: Verify isolated friend deployment
        run: node scripts/verify-cloud-payload.js
      - name: Prepare verified runtime tools
        run: node scripts/prepare-macos-tools.js
      - name: Build and smoke-test shipped installer
        env:
          BUILD_SEQUENCE: ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          export DAILY_RELAY_BUILD_VERSION="$(node -p 'require("./package.json").version')-build.$BUILD_SEQUENCE"
          node scripts/build-macos.js
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.js
