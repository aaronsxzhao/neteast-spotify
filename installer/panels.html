<!-- Fragments for public/index.html, not a separate page. -->
<template id="install-progress">
  <nav class="install-progress" aria-label="安装进度"><span id="step-n">01 网易云</span><span id="step-s">02 Spotify</span><span id="step-g">03 云端授权</span><span id="step-d">04 自动运行</span></nav>
  <p id="notice" role="status" aria-live="polite" hidden></p>
</template>
<template id="install-manual-sync">
  <article class="setup-card install-manual-card">
    <div><h3>连接完成，先同步一次</h3><p id="manual-help">连接网易云与 Spotify 后，即可手动同步，不需要先连接 GitHub。本机同步期间请保持 App 运行。</p></div>
    <button class="button button-primary" id="manual-sync" disabled>立即同步一次</button>
    <p id="manual-status" role="status" aria-live="polite"></p>
    <a id="manual-playlist" class="text-link" target="_blank" rel="noreferrer" hidden>打开 Spotify 歌单 ↗</a>
  </article>
</template>
<template id="install-spotify-guide">
  <details class="install-guide" id="spotify-guide"><summary>首次连接？展开完整 Spotify 设置指引</summary><ol>
    <li><strong>打开自己的开发者后台。</strong><p>开发模式要求应用所有者拥有有效 Premium。</p><a href="https://developer.spotify.com/dashboard" target="_blank" rel="noreferrer">打开 Spotify 开发者后台 ↗</a></li>
    <li><strong>选择 Create app。</strong><p>App name 填 <code>My Daily Relay</code>；描述填 <code>Sync my own daily music recommendations</code>。Website 如为选填可留空。</p></li>
    <li><strong>添加 Redirect URI。</strong><p>复制本卡片下方的完整回调地址并保存。不要改成 localhost，也不要多加斜杠。</p></li>
    <li><strong>API / SDK 只勾选 Web API。</strong><p>阅读并同意 Spotify 条款，保存应用。若出现 Users and Access，确认自己的 Spotify 登录邮箱在允许用户列表中。</p></li>
    <li><strong>从 Settings 复制 Client ID。</strong><p>填入下方，再点连接。不要复制 Client Secret。</p></li>
  </ol><p>回调地址报错：检查完整地址。403：检查 Premium、允许用户及应用归属。遇到冷却请等待，不要反复重试。</p></details>
</template>
<template id="install-cloud-setup">
  <div class="section-heading"><div><span class="section-number">02</span><h2>让它每天运行</h2></div><p>额外确认一次 GitHub 授权。仓库、Secrets 和定时任务由助手配置，不需要你操作 GitHub 流程。</p></div>
  <div class="setup-grid">
    <article class="setup-card">
      <div class="card-topline"><span class="service-mark netease">G</span><span class="step-state" id="github-status">未授权</span></div>
      <h3>你的账号，你的云端</h3><p>在你自己的 GitHub 账号下运行。作者不会收到你的音乐登录凭证。</p>
      <details class="install-guide"><summary>授权范围与凭证保存位置</summary><p>使用 GitHub 官方 CLI，申请仓库和工作流权限。授权范围可能覆盖你有权限的其他仓库，但助手只操作自己创建并校验归属的 Daily Relay 仓库。</p><p>GitHub 登录令牌保存在此电脑的独立配置目录，仅当前用户可读，未使用系统钥匙串。音乐凭证和加密密钥写入你自己的 GitHub Secrets。请只在自己的可信电脑使用。</p></details>
      <label class="install-check"><input type="checkbox" id="github-consent">我理解授权范围，允许助手配置我自己的 GitHub 云端同步。</label>
      <button class="button button-dark" id="github-connect">连接我的 GitHub</button>
      <div id="github-code-panel" hidden><p>打开验证页，输入一次性验证码并确认：</p><div class="copy-row"><code id="github-code"></code><button id="copy-code">复制</button></div><a class="text-link" href="https://github.com/login/device" target="_blank" rel="noreferrer">打开 GitHub 授权页 ↗</a><p>请确认登录的是你自己的账号。完成后回到这里，助手会自动检测。</p></div>
    </article>
    <article class="setup-card">
      <div class="card-topline"><span class="status-kicker">SET IT IN MOTION</span></div>
      <h3>开启每天自动同步</h3><p>创建你的专属仓库与私密 Spotify 歌单，并发起首次同步。部署完成不等于同步成功，下方会显示实际结果。</p>
      <label for="visibility">云端仓库可见性</label><select id="visibility"><option value="private">私有 · 使用账号自带 Actions 额度</option><option value="public">公开 · 标准 Actions 运行免费</option></select>
      <details class="install-guide"><summary>费用与公开范围</summary><p>私有仓库额度与其他项目共享；超额可能暂停或计费，取决于你的 GitHub 账单设置。助手不会启用付费额度。公开仓库会包含程序和加密状态，但不会包含明文凭证。</p></details>
      <label class="install-check"><input type="checkbox" id="deploy-consent">允许创建所选仓库、保存凭证、创建私密歌单并发起首次同步。我知道定时可能延迟，登录失效后需要重新连接。</label>
      <button class="button button-primary" id="deploy" disabled>完成连接后，开启自动同步</button><p id="deploy-status" aria-live="polite"></p>
    </article>
  </div>
</template>
<template id="install-cloud-status">
  <div class="section-heading"><div><span class="section-number">03</span><h2>云端同步状态</h2></div><p>关掉电脑后，已启用的任务仍在你自己的 GitHub 上运行。</p></div>
  <p id="cloud-empty">完成上方连接后，这里会显示首次同步的实际结果。</p>
  <article class="setup-card" id="cloud-panel" hidden>
    <div class="card-topline"><span class="status-kicker">YOUR DAILY RELAY</span><span class="step-state" id="cloud-badge">正在确认</span></div>
    <h3 id="cloud-title">云端已配置</h3><p id="cloud-summary">正在核验首次同步结果……</p><p id="cloud-pause"></p>
    <div class="install-actions"><button class="button button-outline" id="refresh">刷新状态</button><button class="button button-outline" id="reconnect">重新连接账号</button><button class="button button-outline" id="pause-cloud">暂停自动同步</button><button class="button button-outline" id="enable-cloud">恢复自动同步</button></div>
    <details class="install-guide"><summary>高级信息与恢复</summary><p id="repo-name"></p><a id="run-link" target="_blank" rel="noreferrer" hidden>查看本次运行记录 ↗</a><p>本机配置保存在用户目录的 Library/Application Support/Daily Relay，其中包含登录凭证和加密密钥，不要分享。换电脑前请安全备份。仅删除 App 不会停止云端任务，请先暂停自动同步。</p></details>
  </article>
</template>
